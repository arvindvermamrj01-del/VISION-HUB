name: Validate Vision Hub
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check all JavaScript syntax
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Run provider utility tests
        run: node --test tests/*.test.mjs
